<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>دبستان</title>
<style>
@font-face { font-family: "Shabnam"; src: url(fonts/shabnam/Shabnam.woff2) format("woff2"); font-weight: 400; font-display: swap; }
@font-face { font-family: "Shabnam"; src: url(fonts/shabnam/Shabnam-Bold.woff2) format("woff2"); font-weight: 700; font-display: swap; }
:root { --bg: #f6f2ea; --card: #fff; --ink: #1f2328; --line: #e6dfd2; --accent: #17695a; --accent-ink: #fff; color-scheme: light; }
@media (prefers-color-scheme: dark) {
  :root { --bg: #121614; --card: #1b211f; --ink: #ece8e0; --line: #2c3431; --accent: #43b39b; --accent-ink: #0d1a17; color-scheme: dark; }
}
body { margin: 0; background: var(--bg); color: var(--ink); font: 18px/1.7 "Shabnam", Tahoma, system-ui, sans-serif; }
main { max-width: 560px; margin: 0 auto; padding: 40px 16px; }
h1 { margin: 0 0 24px; font-size: 2rem; font-weight: 800; }
ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 16px; }
li { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 18px 20px; }
li b { display: block; font-size: 1.15rem; margin-bottom: 12px; }
li span { display: flex; flex-wrap: wrap; gap: 8px; }
a { padding: 4px 18px; border-radius: 99px; background: var(--accent); color: var(--accent-ink); font-weight: 700; text-decoration: none; }
</style>
</head>
<body>
<main>
<h1>دبستان</h1>
<ul>
<li><b>هوش مصنوعی واقعاً چطوری کار می‌کنه؟</b><span><a href="2026-11-22-talk/">اسلایدها</a><a href="2026-11-22-talk/exercises.html">دفتر تمرین</a></span></li>
</ul>
</main>
</body>
</html>
